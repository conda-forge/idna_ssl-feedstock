{% set name = "idna_ssl" %}
{% set version = "1.1.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/idna-ssl-{{ version }}.tar.gz
  sha256: a933e3bb13da54383f9e8f35dc4f9cb9eb9b3b78c6b36f311254d6d0d92c6c7c

build:
  number: 1003
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - idna >=2.0

test:
  imports:
    - idna_ssl
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/aio-libs/idna-ssl
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Patch ssl.match_hostname for Unicode(idna) domains support'

  dev_url: https://github.com/aio-libs/idna-ssl

extra:
  recipe-maintainers:
    - sodre
